name: docker

# a published GitHub release publishes the versioned image (and pypi.yml publishes the package),
# pushes to master and pull requests only build.
#
# Only the free-threaded interpreter is shipped as a container: `latest`, `<version>` and `<major.minor>`
# are all the 3.15t build. The PyPI package covers 3.15 and 3.15t.
on:
  push:
    branches: [master]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PYTHON_VERSION: '3.15t'

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=cryptostore
            org.opencontainers.image.description=Config-driven cryptocurrency market data collector built on cryptofeed (free-threaded Python ${{ env.PYTHON_VERSION }})

      - name: Build${{ github.event_name == 'release' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          load: false
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
          tags: cryptostore:smoke
          cache-from: type=gha

      - name: Run the CLI inside the image
        run: |
          docker run --rm cryptostore:smoke --version
          docker run --rm cryptostore:smoke backends
          docker run --rm -v "$PWD/examples:/config:ro" cryptostore:smoke check /config/config.minimal.yaml
          docker run --rm --entrypoint python cryptostore:smoke -c "
          import sys, sysconfig
          import cryptostore.cli
          from cryptofeed.backends import redis, mongo, postgres, kafka, zmq, influxdb, quest, socket
          print(sys.version)
          assert sysconfig.get_config_var('Py_GIL_DISABLED'), 'the image is not a free-threaded build'
          assert not sys._is_gil_enabled(), 'the GIL was re-enabled on the free-threaded image'
          "
